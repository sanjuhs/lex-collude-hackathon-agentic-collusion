[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lexcollude"
version = "0.2.0"
description = "A synthetic benchmark of document-mediated influence in legal agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lexcollude = "lexcollude.cli:main"

[project.optional-dependencies]
research = ["matplotlib==3.10.8", "numpy==2.3.5", "python-docx==1.2.0"]

[tool.setuptools.packages.find]
include = ["lexcollude*"]

